<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>疟原虫血涂片制作与筛查 — 虚拟仿真实验</title>
  <script type="module" crossorigin src="./assets/index-ltRyCbTF.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CkqiygN2.css">
</head>
<body>
  <!-- 3D 画布容器 -->
  <div id="scene-container"></div>

  <!-- 顶部 HUD：步骤指示 -->
  <div id="hud-top" class="hidden">
    <div id="step-badge">
      <span id="step-index">第 1/7 步</span>
      <span id="step-title">器材准备</span>
    </div>
    <div id="hud-right">
      <span id="mode-badge">教学模式</span>
      <span id="timer" class="hidden">00:00</span>
      <span id="score-display">得分 100</span>
    </div>
  </div>

  <!-- 底部提示栏 -->
  <div id="hud-bottom" class="hidden">
    <div id="hint-text"></div>
  </div>

  <!-- 步骤完成横幅 -->
  <div id="step-banner" class="hidden"></div>

  <!-- 消息提示容器 -->
  <div id="toast-container"></div>

  <!-- 开始界面 -->
  <div id="start-screen">
    <div class="start-card">
      <h1>疟原虫血涂片制作与筛查</h1>
      <h2>虚拟仿真实验</h2>
      <div class="start-desc">
        <p>本实验模拟疟疾诊断的标准流程：末梢采血 → 厚薄血膜制作 → 固定染色 → 显微镜检查 → 虫种鉴定。</p>
        <p>实验共 7 个步骤，满分 100 分。</p>
      </div>
      <div class="mode-select">
        <button id="btn-teaching" class="mode-btn">
          <strong>教学模式</strong>
          <span>全程操作引导与知识讲解</span>
        </button>
        <button id="btn-exam" class="mode-btn">
          <strong>考核模式</strong>
          <span>无提示，操作正误计入成绩</span>
        </button>
      </div>
      <p class="start-tip">操作方式：鼠标拖拽旋转视角 · 滚轮缩放 · 点击/拖动物品进行操作</p>
    </div>
  </div>

  <!-- 镜检覆盖层（步骤6-7 使用） -->
  <div id="microscope-overlay" class="hidden">
    <div id="view-wrapper">
      <canvas id="view-canvas" width="720" height="720"></canvas>
      <div id="view-mask"></div>
      <div id="view-label">10× 物镜</div>
    </div>
    <div id="scope-panel">
      <h3>显微镜操作</h3>
      <div class="panel-group">
        <label>物镜转换</label>
        <div class="btn-row">
          <button class="obj-btn active" data-obj="10">10×</button>
          <button class="obj-btn" data-obj="40">40×</button>
          <button class="obj-btn" data-obj="100">100× 油镜</button>
        </div>
      </div>
      <div class="panel-group">
        <label>香柏油（油镜前必须滴加）</label>
        <button id="btn-oil">滴加香柏油</button>
      </div>
      <div class="panel-group">
        <label>调焦（粗/细准焦螺旋）</label>
        <input type="range" id="focus-slider" min="0" max="100" value="30" />
        <div id="focus-state">图像模糊</div>
      </div>
      <div class="panel-group">
        <label>视野移动：拖拽视野 或 使用方向键</label>
        <div id="found-counter">已找到疟原虫：0 / 3</div>
      </div>
      <p class="panel-tip">找到疟原虫后，<b>直接点击虫体</b>进行标记。</p>
      <button id="btn-finish-scope" disabled>完成镜检</button>
    </div>
  </div>

  <!-- 鉴定问答覆盖层（步骤7） -->
  <div id="quiz-overlay" class="hidden">
    <div id="quiz-card">
      <h3>虫种鉴定</h3>
      <div id="quiz-body"></div>
    </div>
  </div>

  <!-- 成绩单覆盖层 -->
  <div id="report-overlay" class="hidden"></div>

</body>
</html>
